  /v1/simulations:
    post:
      operationId: createSimulation
      tags: [ Simulations ]
      summary: Valida, reserva capacidad y crea una ejecución privada independiente.
      description: >-
        No se inicia ninguna ejecución mediante GET. Idempotency-Key evita duplicados
        por reintentos: misma clave y configuración repiten el ID y token originales;
        otra configuración con la misma clave devuelve 409. El token opaco sólo se
        entrega al crear o repetir esta respuesta; no es una clave administrativa.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Clave opaca de solicitud; el replay exige el mismo cuerpo normalizado.
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulationCreateRequest' }
      responses:
        '201':
          description: Ejecución creada; conservar la credencial sólo en sessionStorage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationCreated' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/SimulationCapacity'
        '403':
          description: Origen CORS rechazado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '405':
          description: Método no permitido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
