      scheme: bearer
      description: Token opaco privado ligado exclusivamente a una simulación; nunca en URL, logs o telemetría.
    SimulatorApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Credencial privada del simulador. Nunca se entrega a React o Flutter.
    OperatorCookie:
      type: apiKey
      in: cookie
      name: __Host-corodev_admin
      description: Cookie de sesión opaca HttpOnly/Secure, independiente de x-api-key;
        no se almacena en Web Storage.
    OperatorCSRF:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token ligado a la sesión; además se exige Origin permitido.
  schemas:
    SimulationConfigInput:
      type: object
      additionalProperties: false
      description: Configuración acotada; propiedades desconocidas se rechazan. refuge_ids vacío o ausente usa todos los refugios predeterminados del grafo.
      properties:
        survivors: { type: integer, minimum: 1, maximum: 200 }
        round: { type: string, enum: [ round1, round2, round3 ] }
        refuge_ids:
          type: array
          maxItems: 4
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 100 }
        rainfall_intensity:
          type: number
          minimum: 0
          maximum: 1
          description: Parámetro sintético exclusivo de urban_flood; no representa lluvia observada ni un pronóstico.
    SimulationConfig:
      type: object
      additionalProperties: false
      required: [ survivors, round, refuge_ids ]
      properties:
        survivors: { type: integer, minimum: 1, maximum: 200 }
        round: { type: string, enum: [ round1, round2, round3 ] }
        refuge_ids:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        rainfall_intensity: { type: number, minimum: 0, maximum: 1 }
    SimulationCreateRequest:
      type: object
      additionalProperties: false
      required: [ scenario, graph_profile ]
      properties:
        scenario: { type: string, enum: [ zombie_outbreak, urban_flood ] }
        graph_profile: { type: string, enum: [ BASE, FULL_MANTA ], default: BASE }
        seed: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991, default: 20261026 }
        max_ticks: { type: integer, minimum: 1, maximum: 150, default: 150 }
        tick_interval_ms: { type: integer, minimum: 1000, maximum: 5000, default: 2000 }
        config: { $ref: '#/components/schemas/SimulationConfigInput' }
    SimulationMetadata:
      type: object
      additionalProperties: false
      required: [ simulation_id, status, tick, max_ticks, state_version, scenario, graph_profile, graph_version, seed, tick_interval_ms, created_at, started_at, updated_at, expires_at, config ]
      properties:
        simulation_id: { type: string, minLength: 1 }
        status:
          type: string
          enum: [ CREATED, RUNNING, PAUSED, COMPLETED, CANCELLED, FAILED ]
        tick: { type: integer, minimum: 0 }
        max_ticks: { type: integer, minimum: 1, maximum: 150 }
        state_version: { type: integer, minimum: 0 }
        scenario: { type: string, enum: [ zombie_outbreak, urban_flood ] }
        graph_profile: { type: string, enum: [ BASE, FULL_MANTA ] }
        graph_version: { type: string, minLength: 1 }
        seed: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
        tick_interval_ms: { type: integer, minimum: 1000, maximum: 5000 }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        config: { $ref: '#/components/schemas/SimulationConfig' }
    SimulationCreated:
      type: object
      additionalProperties: false
      required: [ simulation_id, status, tick, max_ticks, state_version, scenario, graph_profile, graph_version, seed, tick_interval_ms, created_at, started_at, updated_at, expires_at, config, access_token ]
      properties:
        simulation_id: { type: string, minLength: 1 }
        status:
          type: string
          enum: [ CREATED, RUNNING, PAUSED, COMPLETED, CANCELLED, FAILED ]
        tick: { type: integer, minimum: 0 }
        max_ticks: { type: integer, minimum: 1, maximum: 150 }
        state_version: { type: integer, minimum: 0 }
        scenario: { type: string, enum: [ zombie_outbreak, urban_flood ] }
        graph_profile: { type: string, enum: [ BASE, FULL_MANTA ] }
        graph_version: { type: string, minLength: 1 }
        seed: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
        tick_interval_ms: { type: integer, minimum: 1000, maximum: 5000 }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        config: { $ref: '#/components/schemas/SimulationConfig' }
        access_token:
          type: string
          minLength: 32
          description: Credencial opaca; sólo creación, reinicio o replay idempotente. Nunca se devuelve en consultas ni controles normales.
    SimulationState:
      type: object
      additionalProperties: false
      required: [ simulation_id, status, tick, max_ticks, state_version, scenario, graph_profile, graph_version, seed, tick_interval_ms, created_at, started_at, updated_at, expires_at, config, snapshot ]
      properties:
        simulation_id: { type: string, minLength: 1 }
        status:
          type: string
          enum: [ CREATED, RUNNING, PAUSED, COMPLETED, CANCELLED, FAILED ]
        tick: { type: integer, minimum: 0 }
        max_ticks: { type: integer, minimum: 1, maximum: 150 }
        state_version: { type: integer, minimum: 0 }
        scenario: { type: string, enum: [ zombie_outbreak, urban_flood ] }
        graph_profile: { type: string, enum: [ BASE, FULL_MANTA ] }
        graph_version: { type: string, minLength: 1 }
        seed: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
        tick_interval_ms: { type: integer, minimum: 1000, maximum: 5000 }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        config: { $ref: '#/components/schemas/SimulationConfig' }
        snapshot: { $ref: '#/components/schemas/WorldSnapshot' }
        scenario_state: { $ref: '#/components/schemas/ScenarioSnapshot' }
    SimulationResults:
      type: object
      additionalProperties: false
      required: [ simulation_id, status, tick, max_ticks, state_version, scenario, graph_profile, graph_version, seed, tick_interval_ms, created_at, started_at, updated_at, expires_at, config, snapshot, results ]
      properties:
        simulation_id: { type: string, minLength: 1 }
        status:
          type: string
          enum: [ CREATED, RUNNING, PAUSED, COMPLETED, CANCELLED, FAILED ]
        tick: { type: integer, minimum: 0 }
        max_ticks: { type: integer, minimum: 1, maximum: 150 }
        state_version: { type: integer, minimum: 0 }
        scenario: { type: string, enum: [ zombie_outbreak, urban_flood ] }
        graph_profile: { type: string, enum: [ BASE, FULL_MANTA ] }
        graph_version: { type: string, minLength: 1 }
        seed: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
        tick_interval_ms: { type: integer, minimum: 1000, maximum: 5000 }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        config: { $ref: '#/components/schemas/SimulationConfig' }
        snapshot: { $ref: '#/components/schemas/WorldSnapshot' }
        scenario_state: { $ref: '#/components/schemas/ScenarioSnapshot' }
        results: { $ref: '#/components/schemas/SimulationResultMetrics' }
    SimulationResultMetrics:
      type: object
      additionalProperties: false
      required: [ initial_survivors, evacuated, bitten, active, survival_rate, refuges_used ]
      properties:
        initial_survivors: { type: integer, minimum: 1 }
        evacuated: { type: integer, minimum: 0 }
        bitten: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        survival_rate: { type: number, minimum: 0, maximum: 1 }
        refuges_used: { type: integer, minimum: 0 }
    SimulationScenarioCapability:
      type: object
      additionalProperties: false
      required: [ id, name, available, synthetic ]
      properties:
        id: { type: string, enum: [ zombie_outbreak, urban_flood ] }
        name: { type: string, minLength: 1 }
        available: { type: boolean }
        synthetic: { type: boolean }
    SimulationGraphProfile:
      type: object
      additionalProperties: false
      required: [ id, name, available, graph_version, nodes, edges ]
      properties:
        id: { type: string, enum: [ BASE, FULL_MANTA ] }
        name: { type: string, minLength: 1 }
        available: { type: boolean }
        graph_version: { type: string, minLength: 1 }
        nodes: { type: integer, minimum: 1 }
        edges: { type: integer, minimum: 1 }
        disabled_reason: { type: string }
    SimulationDefaults:
      type: object
      additionalProperties: false
      required: [ scenario, graph_profile, seed, max_ticks, tick_interval_ms, survivors, round ]
      properties:
        scenario: { type: string, enum: [ zombie_outbreak, urban_flood ] }
        graph_profile: { type: string, enum: [ BASE, FULL_MANTA ] }
        seed: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
        max_ticks: { type: integer, minimum: 1, maximum: 150 }
        tick_interval_ms: { type: integer, minimum: 1000, maximum: 5000 }
        survivors: { type: integer, minimum: 1, maximum: 200 }
        round: { type: string, enum: [ round1, round2, round3 ] }
    SimulationLimits:
      type: object
      additionalProperties: false
      required: [ max_active, max_full_active, max_retained, max_memory_bytes, min_tick_interval_ms, max_tick_interval_ms, max_ticks, max_survivors ]
      properties:
        max_active: { type: integer, minimum: 1 }
        max_full_active: { type: integer, minimum: 0 }
        max_retained: { type: integer, minimum: 1 }
        max_memory_bytes: { type: integer, minimum: 1 }
        min_tick_interval_ms: { type: integer, minimum: 1 }
        max_tick_interval_ms: { type: integer, minimum: 1 }
        max_ticks: { type: integer, minimum: 1 }
        max_survivors: { type: integer, minimum: 1 }
    SimulationCapabilities:
      type: object
      additionalProperties: false
      required: [ scenarios, graph_profiles, defaults, limits, rounds ]
      properties:
        scenarios:
          type: array
          items: { $ref: '#/components/schemas/SimulationScenarioCapability' }
        graph_profiles:
          type: array
          items: { $ref: '#/components/schemas/SimulationGraphProfile' }
        defaults: { $ref: '#/components/schemas/SimulationDefaults' }
        limits: { $ref: '#/components/schemas/SimulationLimits' }
        rounds:
          type: array
          items: { $ref: '#/components/schemas/SimulationRound' }
    GraphNode:
      type: object
      additionalProperties: false
      required: [ id, lat, lng ]
      properties:
        id: { type: string, minLength: 1 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    GeoPoint:
      type: object
      additionalProperties: false
      required: [ lat, lng ]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    SpawnZone:
      type: object
      additionalProperties: false
      required: [ id, name, source, geometry, node_ids, weight ]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        source: { type: string, minLength: 1 }
        geometry:
          type: array
          minItems: 4
          items: { $ref: '#/components/schemas/GeoPoint' }
        node_ids:
          type: array
          minItems: 1
          items: { type: string }
        weight: { type: number, minimum: 0 }
    GraphEdge:
      type: object
      additionalProperties: false
      required: [ id, from, to, distance_m, road_type, speed_mps, blocked, directed ]
      properties:
        id: { type: string, minLength: 1 }
        from: { type: string, minLength: 1 }
        to: { type: string, minLength: 1 }
        distance_m: { type: number, exclusiveMinimum: true, minimum: 0 }
        road_type: { type: string, minLength: 1 }
        speed_mps: { type: number, exclusiveMinimum: true, minimum: 0 }
        blocked: { type: boolean }
        directed: { type: boolean }
        bridge: { type: boolean }
        geometry:
          type: array
          items: { $ref: '#/components/schemas/GeoPoint' }
    Shelter:
      type: object
      additionalProperties: false
      required: [ id, node_id, capacity, occupancy ]
      properties:
        id: { type: string, minLength: 1 }
        node_id: { type: string, minLength: 1 }
        capacity: { type: integer, minimum: 1 }
        occupancy: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        available: { type: integer, minimum: 0 }
    Graph:
      type: object
      additionalProperties: false
      required: [ version, source, nodes, edges, shelters ]
      properties:
        version: { type: string, minLength: 1 }
        source: { type: string, minLength: 1 }
        nodes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/GraphNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/GraphEdge' }
        shelters:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/Shelter' }
        spawn_zones:
          type: array
          items: { $ref: '#/components/schemas/SpawnZone' }
        coverage:
          type: array
          items: { $ref: '#/components/schemas/GeoPoint' }
    Zombie:
      type: object
      additionalProperties: false
      required: [ id, type, current_node, movement_state, awake, path ]
      properties:
        id: { type: string, minLength: 1 }
        type: { type: string, enum: [ walker, runner, horde, sleeper ] }
        current_node: { type: string, minLength: 1 }
        movement_state: { type: string }
        awake: { type: boolean }
        path:
          type: array
          description: Recorrido del turno incluyendo origen, nodos intermedios y destino.
          items: { type: string }
    Survivor:
      type: object
      additionalProperties: false
      required: [ id, current_node, status, target_shelter_id, planned_route ]
      properties:
        id: { type: string, minLength: 1 }
        current_node: { type: string, minLength: 1 }
        status: { type: string, enum: [ active, bitten, evacuated ] }
        target_shelter_id: { type: string }
        spawn_zone_id: { type: string }
        planned_route:
          type: array
          items: { type: string }
    WorldEvent:
      type: object
      additionalProperties: false
      required: [ turn, type, entity_id, edge_id, message ]
      properties:
        turn: { type: integer, minimum: 0 }
        type: { type: string }
        entity_id: { type: string }
        edge_id: { type: string }
        message: { type: string }
    WorldMetrics:
      type: object
      additionalProperties: false
      required:
        [
          evacuated,
          bitten,
          active,
          turns,
          requests_success,
          requests_invalid,
          requests_timeout,
          http_p50_ms,
          http_p95_ms,
          http_p99_ms,
          availability
        ]
      properties:
        evacuated: { type: integer, minimum: 0 }
        bitten: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        turns: { type: integer, minimum: 0 }
        requests_success: { type: integer, minimum: 0 }
        requests_invalid: { type: integer, minimum: 0 }
        requests_timeout: { type: integer, minimum: 0 }
        http_p50_ms: { type: number, minimum: 0 }
        http_p95_ms: { type: number, minimum: 0 }
        http_p99_ms: { type: number, minimum: 0 }
        availability: { type: number, minimum: 0, maximum: 1 }
    WorldSnapshot:
      type: object
      additionalProperties: false
      required:
        [
          turn,
          world_version,
          graph_version,
          zombies,
          survivors,
          shelters,
          blocked_edges,
          events,
          metrics
        ]
      properties:
        scenario_type:
          type: string
          enum: [ urban_flood ]
          description: Presente en inundación experimental; ausente en zombie histórico.
        turn: { type: integer, minimum: 0 }
        world_version: { type: integer, minimum: 0 }
        graph_version: { type: string }
        zombies:
          type: array
          description: Solo zombies visibles; los sleepers dormidos se excluyen
            completamente.
          items: { $ref: '#/components/schemas/Zombie' }
        survivors:
          type: array
          items: { $ref: '#/components/schemas/Survivor' }
        shelters:
          type: array
          items: { $ref: '#/components/schemas/Shelter' }
        blocked_edges:
          type: array
          items: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/WorldEvent' }
        metrics: { $ref: '#/components/schemas/WorldMetrics' }
        simulation:
          $ref: "#/components/schemas/SimulationInfo"
    FloodZone:
      type: object
      additionalProperties: false
      required: [ id, center, radius_m, intensity ]
      properties:
        id: { type: string, minLength: 1 }
        center: { $ref: '#/components/schemas/GeoPoint' }
        radius_m: { type: number, minimum: 0 }
        intensity:
          type: number
          minimum: 0
          maximum: 1
          description: Exposición sintética normalizada, no profundidad del agua.
    RoadCondition:
      type: object
      additionalProperties: false
      required: [ edge_id, state, risk_score, risk_source, updated_at_simulation_step, cost_multiplier ]
      properties:
        edge_id: { type: string, minLength: 1 }
        state: { type: string, enum: [ passable, caution, blocked ] }
        risk_score: { type: number, minimum: 0, maximum: 1 }
        risk_source: { type: string, minLength: 1 }
        updated_at_simulation_step: { type: integer, minimum: 0 }
        cost_multiplier: { type: number, minimum: 1 }
    ShelterCondition:
      type: object
      additionalProperties: false
      required: [ shelter_id, state, risk_score, updated_at_simulation_step ]
      properties:
        shelter_id: { type: string, minLength: 1 }
        state: { type: string, enum: [ available, full, exposed, inaccessible ] }
        risk_score: { type: number, minimum: 0, maximum: 1 }
        updated_at_simulation_step: { type: integer, minimum: 0 }
    FloodAgent:
      type: object
      additionalProperties: false
      required: [ id, current_node, state, behavior, target_shelter_id, planned_route ]
      properties:
        id: { type: string, minLength: 1 }
        current_node: { type: string, minLength: 1 }
        state: { type: string, enum: [ waiting, moving, isolated, evacuated ] }
        behavior: { type: string, enum: [ preventive, late, adaptive ] }
        target_shelter_id: { type: string }
        planned_route:
          type: array
          items: { type: string }
        evacuation_time:
          type: number
          minimum: 0
          description: Tiempo simulado de llegada al refugio; ausente hasta evacuar.
    EvacuationMetrics:
      type: object
      additionalProperties: false
      required: [ total_agents, evacuated_agents, isolated_agents, waiting_agents, average_evacuation_time, blocked_edges, caution_edges, shelters_at_capacity, reroute_count, simulation_total_duration ]
      properties:
        total_agents: { type: integer, minimum: 0 }
        evacuated_agents: { type: integer, minimum: 0 }
        isolated_agents: { type: integer, minimum: 0 }
        waiting_agents: { type: integer, minimum: 0 }
        average_evacuation_time:
          type: number
          minimum: 0
          description: Media entre agentes evacuados, en unidades del reloj simulado; cero si no hay evacuados.
        blocked_edges: { type: integer, minimum: 0 }
        caution_edges: { type: integer, minimum: 0 }
        shelters_at_capacity: { type: integer, minimum: 0 }
        reroute_count: { type: integer, minimum: 0 }
        simulation_total_duration:
          type: number
          minimum: 0
          description: Tiempo transcurrido en el reloj simulado, separado del rendimiento del proceso.
    SimulationPerformance:
      type: object
      additionalProperties: false
      required: [ simulation_step_latency_ms, simulation_total_duration_ms ]
      properties:
        simulation_step_latency_ms:
          type: number
          minimum: 0
          description: Duración de procesamiento del último paso en milisegundos de reloj real.
        simulation_total_duration_ms:
          type: number
          minimum: 0
          description: Duración de procesamiento acumulada en milisegundos de reloj real; no determinista.
    DataProvenance:
      type: object
      additionalProperties: false
      required: [ graph_source, model, elevation_source, disclaimer ]
      properties:
        graph_source: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        elevation_source:
          type: string
          description: Fuente verificable de elevación o indicación explícita de que no se usaron elevaciones.
        disclaimer:
          type: string
          description: Limitación científica del modelo sintético de inundación.
        geographic_reference:
          $ref: "#/components/schemas/ReferenceUse"
    ScenarioSnapshot:
      type: object
      additionalProperties: false
      required: [ scenario_type, simulation_step, world_version, graph_version, simulation_time, simulation_duration, time_step, rainfall, flood_zones, road_conditions, shelter_conditions, agents, evacuation_metrics, performance, data_provenance ]
      properties:
        scenario_type: { type: string, enum: [ urban_flood ] }
        simulation_step: { type: integer, minimum: 0 }
        world_version: { type: integer, minimum: 0 }
        graph_version: { type: string, minLength: 1 }
        simulation_time:
          type: number
          minimum: 0
          description: Reloj simulado; simulation_step multiplicado por time_step.
        simulation_duration:
          type: number
          minimum: 0
          description: Duración configurada en unidades del reloj simulado.
        time_step: { type: number, exclusiveMinimum: true, minimum: 0 }
        rainfall:
          type: number
          minimum: 0
          maximum: 1
          description: Intensidad sintética normalizada del paso actual; no precipitación medida.
        flood_zones:
          type: array
          items: { $ref: '#/components/schemas/FloodZone' }
        road_conditions:
          type: array
          description: Overlay por ID sobre /grafo, sin duplicar geometrías viales.
          items: { $ref: '#/components/schemas/RoadCondition' }
        shelter_conditions:
          type: array
          items: { $ref: '#/components/schemas/ShelterCondition' }
        agents:
          type: array
          items: { $ref: '#/components/schemas/FloodAgent' }
        evacuation_metrics: { $ref: '#/components/schemas/EvacuationMetrics' }
        performance: { $ref: '#/components/schemas/SimulationPerformance' }
        data_provenance: { $ref: '#/components/schemas/DataProvenance' }
    StepRequest:
      type: object
      additionalProperties: false
      required: [ sobrevivienteId, nodoActual, turno ]
      properties:
        sobrevivienteId: { type: string, minLength: 1, maxLength: 100 }
        nodoActual: { type: string, minLength: 1, maxLength: 100 }
        turno: { type: integer, minimum: 0 }
    StepResponse:
      type: object
      additionalProperties: false
      required: [ siguienteNodo ]
      properties:
        siguienteNodo: { type: string, minLength: 1 }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [ status, service, version ]
      properties:
        status:
          type: string
          enum: [ ok ]
        service:
          type: string
        version:
          type: string
    DemoItem:
      type: object
      additionalProperties: false
      required: [ id, title, description, status, createdAt ]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [ active, pending, completed ]
        createdAt:
          type: string
          format: date-time
    Pagination:
      type: object
      additionalProperties: false
      required: [ page, pageSize, total ]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    ItemListResponse:
      type: object
      additionalProperties: false
      required: [ data, pagination ]
      properties:
        data:
          type: array
          items:
