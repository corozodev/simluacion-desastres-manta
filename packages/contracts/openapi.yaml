                maxItems: 2
              minItems: 4
            minItems: 1
          minItems: 1
    ReferenceProperties:
      type: object
      additionalProperties: false
      required:
        - object_id
        - susceptibility
      properties:
        object_id:
          type: string
        susceptibility:
          type: string
          enum:
            - ALTA
            - MEDIA
            - BAJA
        source_year:
          type: integer
    ReferenceFeature:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - properties
        - geometry
      properties:
        type:
          type: string
          enum:
            - Feature
        id:
          type: string
        properties:
          $ref: "#/components/schemas/ReferenceProperties"
        geometry:
          $ref: "#/components/schemas/ReferenceGeometry"
    ReferenceCollection:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - type
        - bbox
        - features
        - provenance
        - feature_count
        - vertex_count
        - generalization_degrees
      properties:
        schema_version:
          type: integer
          enum:
            - 1
        type:
          type: string
          enum:
            - FeatureCollection
        bbox:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
        features:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceFeature"
          maxItems: 500
        provenance:
          $ref: "#/components/schemas/ReferenceProvenance"
        feature_count:
          type: integer
          minimum: 0
        vertex_count:
          type: integer
          minimum: 0
        generalization_degrees:
          type: number
          minimum: 0
    OfficialRainEvent:
      type: object
      additionalProperties: false
      required:
        - object_id
        - event
        - canton
        - event_date
        - closed_date
        - latitude
        - longitude
      properties:
        object_id:
          type: string
        event:
          type: string
        canton:
          type: string
        event_date:
          type: string
        closed_date:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        declared_update_date:
          type: string
    OfficialRainEvents:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - events
        - provenance
      properties:
        schema_version:
          type: integer
          enum:
            - 1
        events:
          type: array
          items:
            $ref: "#/components/schemas/OfficialRainEvent"
          maxItems: 500
        provenance:
          $ref: "#/components/schemas/ReferenceProvenance"
    ReferenceProviderMetrics:
      type: object
      additionalProperties: false
      required:
        - queries
        - provider_errors
        - cache_hits
        - cache_misses
        - last_query_ms
        - total_query_ms
        - response_bytes
        - last_refresh_ms
      properties:
        queries:
          type: integer
          minimum: 0
        provider_errors:
          type: integer
          minimum: 0
        cache_hits:
          type: integer
          minimum: 0
        cache_misses:
          type: integer
          minimum: 0
        last_query_ms:
          type: number
          minimum: 0
        total_query_ms:
          type: number
          minimum: 0
        response_bytes:
          type: integer
          minimum: 0
        last_refresh_ms:
          type: number
          minimum: 0
    ReferenceStatus:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - mode
        - availability
        - refreshing
        - provider_status
        - message
        - feature_count
        - vertex_count
        - metrics
      properties:
        schema_version:
          type: integer
          enum:
            - 1
        mode:
          type: string
          enum:
            - offline
            - online
            - disabled
        availability:
          type: string
          enum:
            - cached
            - stale
            - unavailable
            - disabled
        refreshing:
          type: boolean
        provider_status:
          type: string
          enum:
            - unknown
            - ok
            - error
            - offline
        message:
          type: string
        dataset_version:
          type: string
        provenance:
          $ref: "#/components/schemas/ReferenceProvenance"
        feature_count:
          type: integer
          minimum: 0
        vertex_count:
          type: integer
          minimum: 0
        last_refresh_error:
          type: string
        metrics:
          $ref: "#/components/schemas/ReferenceProviderMetrics"
        event_dataset_version:
          type: string
    LabGeographicReference:
      type: object
      additionalProperties: false
      required:
        - enabled
        - strength
      properties:
        enabled:
          type: boolean
        dataset_version:
          type: string
        strength:
          type: number
          minimum: 0
          maximum: 1
    ReferenceZoneUse:
      type: object
      additionalProperties: false
      required:
        - zone_id
        - susceptibility
        - factor
        - feature_ids
      properties:
        zone_id:
          type: string
        susceptibility:
          type: string
          enum:
            - ALTA
            - MEDIA
            - BAJA
            - NONE
        factor:
          type: number
          minimum: 1
          maximum: 3
        feature_ids:
          type: array
          items:
            type: string
    ReferenceUse:
      type: object
      additionalProperties: false
      required:
        - category
        - dataset_version
        - source_url
        - consulted_at
        - strength
        - zones
      properties:
        category:
          type: string
          enum:
            - official_reference
        dataset_version:
          type: string
        source_url:
          type: string
          format: uri
        consulted_at: *a1
        strength:
          type: number
          minimum: 0
          maximum: 1
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceZoneUse"
    LabTelemetry:
      type: object
      additionalProperties: false
      required:
        - run_id
        - simulation_step
        - world_version
        - agents
        - edges
        - overlay_edges
        - overlay_update_ms
        - replanning_ms
        - simulation_step_ms
        - planning_calls
        - reference
      properties:
        run_id:
          type: string
        simulation_step:
          type: integer
          minimum: 0
        world_version:
          type: integer
          minimum: 0
        agents:
          type: integer
          minimum: 0
        edges:
          type: integer
          minimum: 0
        overlay_edges:
          type: integer
          minimum: 0
        overlay_update_ms:
          type: number
          minimum: 0
        replanning_ms:
          type: number
          minimum: 0
        simulation_step_ms:
          type: number
          minimum: 0
        planning_calls:
          type: integer
          minimum: 0
        reference:
          $ref: "#/components/schemas/ReferenceProviderMetrics"

  responses:
    SimulationExpired:
      description: Sesión caducada conocida temporalmente; después de retirar su tombstone devuelve 404.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Presupuesto de solicitudes agotado; Retry-After indica cuándo reintentar.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SimulationCapacity:
      description: Cupos activos, sesiones retenidas o presupuesto de memoria agotados; no se crea trabajo.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Falta la credencial privada o no es válida.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Turno, nodo o estado del sobreviviente incoherente con el snapshot.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: Aún no existe un snapshot disponible.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Timeout:
      description: Se agotó el tiempo para decidir el movimiento.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Entrada inválida; details identifica los campos con problemas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Error interno; no expone detalles privados de implementación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
