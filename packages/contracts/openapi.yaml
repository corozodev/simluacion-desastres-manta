openapi: 3.0.3
info:
  title: CoroDev Spooky API
  version: 0.5.0
  description: API Go de evacuación y controles entre rondas; conserva esquemas
    históricos de FASE 2.
servers:
  - url: https://api.sistemamanta.lexinnovate.com
    description: Go en AWS
  - url: http://127.0.0.1:8080
    description: Go local
tags:
  - name: System
  - name: Demo
  - name: Evacuation
  - name: Simulations
paths:
  /metrics:
    get:
      operationId: getSimulationMetrics
      tags: [ System, Simulations ]
      summary: Métricas agregadas del ejecutor; sin IDs de sesión ni credenciales.
      responses:
        '200':
          description: Exposición Prometheus de contadores, sesiones, memoria estimada y tiempos acumulados.
          content:
            text/plain:
              schema: { type: string }
        '403':
          description: Origen CORS rechazado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '405':
          description: Método no permitido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Presupuesto de solicitudes agotado; consultar Retry-After.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /healthz:
    get:
      operationId: getEvacuationHealth
      tags: [ System ]
      summary: Comprueba la disponibilidad del proceso Go.
      responses:
        '200':
          description: Proceso disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /estado:
    get:
      operationId: getWorldState
      tags: [ Evacuation ]
      summary: Snapshot público observable; nunca revela sleepers dormidos.
      responses:
        '200':
          description: Estado inmutable del turno publicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldSnapshot'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/scenario:
    get:
      operationId: getScenarioState
      tags: [ Evacuation ]
      summary: Estado experimental de inundación urbana para polling.
      description: >-
        Snapshot observable del mismo turno publicado por /estado. No incluye el
        grafo estático; road_conditions referencia sus aristas mediante edge_id.
        Las exposiciones son índices sintéticos normalizados, no profundidades
        del agua ni umbrales certificados de seguridad. El escenario zombie
        devuelve 404. Consultar graph_version y world_version para sincronizar.
      responses:
        '200':
          description: Estado inmutable de urban_flood.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioSnapshot'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /grafo:
    get:
      operationId: getWorldGraph
      tags: [ Evacuation ]
      summary: Grafo estático versionado; bloqueos dinámicos se consultan en /estado.
      responses:
        '200':
          description: Grafo geográfico cargado y validado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
        '503':
          $ref: '#/components/responses/Unavailable'
        "409":
          description: La ronda cambió; volver a consultar /estado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      parameters:
        - name: mode
          in: query
          description: Previsualización pública de un preset; no cambia la ronda activa.
          schema:
            type: string
            enum:
              - competition
              - full
              - expanded
        - name: run_id
          in: query
          description: Rechaza con409 si la ronda activa cambió; no se combina con mode.
          schema:
            type: string
  /paso:
    post:
      operationId: decideNextStep
      tags: [ Evacuation ]
      summary: Decide un vecino transitable o espera en el nodo actual.
      description: No muta el mundo. El turno y nodo deben coincidir con el
        sobreviviente activo del snapshot publicado. Tiempo máximo de la llamada
        500 ms.
      security:
        - SimulatorApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepRequest'
      responses:
        '200':
          description: Siguiente movimiento válido para el snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /health:
    get:
      operationId: getHealth
      tags: [ System ]
      summary: Comprueba la disponibilidad de la API.
      responses:
        '200':
          description: API disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/demo/items:
    get:
      operationId: listDemoItems
      tags: [ Demo ]
      summary: Lista elementos de demostración con búsqueda y paginación.
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Página de resultados; una búsqueda sin coincidencias devuelve data
            vacío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/demo/items/{id}:
    get:
      operationId: getDemoItem
      tags: [ Demo ]
      summary: Obtiene un elemento por su identificador.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Elemento encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/demo/submit:
    post:
      operationId: submitDemo
      tags: [ Demo ]
      summary: Valida y acepta un formulario de demostración sin persistencia.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
      responses:
        '202':
          description: Formulario aceptado; la demo no persiste datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /simulation/catalog:
    get:
      operationId: getSimulationCatalog
      tags:
        - Evacuation
      summary: Catálogo aprobado; previsualizar no inicia una ronda.
      responses:
        "200":
          description: "Respuesta pública. "
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationCatalog"
        "503":
          description: El estado no está preparado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /simulation:
    get:
      operationId: getSimulationInfo
      tags:
        - Evacuation
      summary: Ejecución actual y configuración pública.
      responses:
        "200":
          description: "Respuesta pública. "
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationInfo"
        "503":
          description: El estado no está preparado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /runs/{run_id}/estado:
    get:
      operationId: getCompletedRunState
      tags:
        - Evacuation
      summary: Snapshot observable conservado de una ronda terminada; historial
        acotado en memoria.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{32}$
      responses:
        "200":
          description: Snapshot público conservado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldSnapshot"
        "404":
          description: Ronda no conservada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/session:
    get:
      operationId: getOperatorSession
      tags:
        - System
      summary: Estado de sesión; sólo una sesión válida recibe token CSRF.
      responses:
        "200":
          description: Sesión o visitante.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorSession"
    post:
      operationId: createOperatorSession
      tags:
        - System
      summary: Intercambia un código independiente generado en servidor por cookie
        HttpOnly. Requiere Origin permitido y JSON; tiene límite de intentos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorLogin"
      responses:
        "200":
          description: Sesión autenticada; cookie Secure HttpOnly SameSite=Strict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorSession"
        "400":
          description: JSON no válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Acceso rechazado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Origin rechazado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Demasiados intentos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Administración no configurada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteOperatorSession
      tags:
        - System
      summary: Revoca la sesión y su cookie; requiere Origin y CSRF.
      security:
        - OperatorCookie: []
          OperatorCSRF: []
      responses:
        "200":
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorSession"
        "401":
          description: Sesión requerida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: CSRF u Origin rechazado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/runs:
    post:
      operationId: startSimulationRun
      tags:
        - Evacuation
      summary: Inicia sólo entre rondas; no interrumpe una ejecución ni permite rutas
        de archivo arbitrarias.
      security:
        - OperatorCookie: []
          OperatorCSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSimulation"
      responses:
        "201":
          description: Nueva ronda; estado anterior conservado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationInfo"
        "400":
          description: Configuración no válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sesión requerida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: CSRF, Origin o modo no habilitado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ronda activa, inicio en progreso o identificador anterior obsoleto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No pudo prepararse la ronda; estado anterior intacto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /lab/session:
    get:
      operationId: getLabSession
      tags:
        - Evacuation
      summary: Crea o recupera una sesión efímera local del laboratorio.
      responses:
        "200":
          description: Estado observable del laboratorio sintético.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabSession"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /lab/catalog:
    get:
      operationId: getLabCatalog
      tags:
        - Evacuation
      summary: Configuraciones experimentales y grafos revisados del laboratorio.
      responses:
        "200":
          description: Estado observable del laboratorio sintético.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabCatalog"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /lab/graph:
    get:
      operationId: getLabGraph
      tags:
        - Evacuation
      summary: Geografía real del modo o de la ejecución del laboratorio.
      parameters:
        - in: query
          name: mode
          required: false
          schema:
            type: string
            enum:
              - competition
              - full
        - in: query
          name: run_id
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Estado observable del laboratorio sintético.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Graph"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /lab/state:
    get:
      operationId: getLabState
      tags:
        - Evacuation
      summary: Estado real, reloj, timeline y comparación del laboratorio.
      responses:
        "200":
          description: Estado observable del laboratorio sintético.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabState"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /lab/runs:
    post:
      operationId: startLabRun
      tags:
        - Evacuation
      summary: Inicia una tormenta con configuración validada.
      description: Sólo servidor experimental loopback. Requiere sesión HttpOnly,
        Origin permitido y cabecera X-CSRF-Token.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabRunRequest"
      responses:
        "200":
          description: Estado observable del laboratorio sintético.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabState"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /lab/actions:
    post:
      operationId: controlLabRun
      tags:
        - Evacuation
      summary: Pausa, continúa, reinicia, repite o cambia el intervalo real.
      description: Sólo servidor experimental loopback. Requiere sesión HttpOnly,
        Origin permitido y cabecera X-CSRF-Token.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabAction"
      responses:
        "200":
          description: Estado observable del laboratorio sintético.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabState"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /lab/candidates/validate:
    post:
      operationId: validateLabCandidates
      tags:
        - Evacuation
      summary: Valida y ajusta cuatro candidatos a la red vial.
      description: Sólo servidor experimental loopback. Requiere sesión HttpOnly,
        Origin permitido y cabecera X-CSRF-Token.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabCandidateRequest"
      responses:
        "200":
          description: Estado observable del laboratorio sintético.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabCandidateValidation"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /lab/comparisons:
    post:
      operationId: compareLabShelters
      tags:
        - Evacuation
      summary: Compara originales y personalizados con orígenes y amenaza congelados.
      description: Sólo servidor experimental loopback. Requiere sesión HttpOnly,
        Origin permitido y cabecera X-CSRF-Token.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabRunRequest"
      responses:
        "200":
          description: Estado observable del laboratorio sintético.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabState"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/incidents/config:
    get:
      operationId: getIncidentServiceInfo
      tags:
        - Evacuation
      summary: Área y límites del servicio experimental de reportes.
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentServiceInfo"
        "400":
          description: Datos o asociación geográfica no válidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Se requiere autorización del laboratorio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Incidente no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflicto de idempotencia o versión.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Límite de recepción alcanzado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Almacén persistente no disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/incidents/resolve:
    post:
      operationId: resolveIncidentLocation
      tags:
        - Evacuation
      summary: Relaciona coordenadas declaradas con calles OSM; no certifica su veracidad.
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResolution"
        "400":
          description: Datos o asociación geográfica no válidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Se requiere autorización del laboratorio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Incidente no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflicto de idempotencia o versión.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Límite de recepción alcanzado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Almacén persistente no disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentLocation"
  /v1/incidents:
    get:
      operationId: listIncidents
      tags:
        - Evacuation
      summary: Consulta novedades declaradas; no son hechos oficiales confirmados.
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentList"
        "400":
          description: Datos o asociación geográfica no válidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Se requiere autorización del laboratorio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Incidente no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflicto de idempotencia o versión.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Límite de recepción alcanzado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Almacén persistente no disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      parameters:
        - name: bbox
          in: query
          schema:
            type: string
          description: minLongitude,minLatitude,maxLongitude,maxLatitude.
        - name: incident_type
          in: query
          schema:
            type: string
            enum:
              - flooded_road
              - road_closed
              - landslide
              - fallen_tree
              - bridge_damage
              - other
        - name: verification_status
          in: query
          schema:
            type: string
            enum:
              - pending
              - corroborated
              - verified
              - rejected
              - expired
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Fecha declarada de evento mínima.
        - name: until
          in: query
          schema:
            type: string
            format: date-time
        - name: received_after
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
    post:
      operationId: createCitizenIncident
      tags:
        - Evacuation
      summary: Registra un reporte ciudadano pendiente; fuerza procedencia citizen.
      responses:
        "200":
          description: Repetición idempotente o duplicado detectado.
          content:
            application/json:
              schema:
