<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="730" viewBox="0 0 1220 730" role="img" aria-labelledby="title desc">
<title id="title">CoroDev: arquitectura local y despliegue AWS comprobado</title><desc id="desc">React y Flutter consultan snapshots públicos mediante HTTPS. Caddy dirige hacia un backend Go persistente en EC2. El simulador consulta paso por HTTP privado. S3 privado y CloudFront sirven React. CloudWatch recibe logs y el Budget existente está verificado. El stack AWS está CREATE_COMPLETE.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a78bfa"/></marker><style>text{font-family:system-ui,sans-serif;fill:#eee7ff} .title{font-size:25px;font-weight:700} .label{font-size:18px;font-weight:600} .small{font-size:14px;fill:#c8bed9}.box{fill:#211b30;stroke:#67517e;stroke-width:2}.flow{stroke:#a78bfa;stroke-width:2;fill:none;marker-end:url(#a)}.orange{fill:#ffad66}</style></defs>
<rect width="1220" height="730" fill="#100d18"/>
<text x="35" y="43" class="title">CoroDev · Escape de Manta Zombie</text><text x="35" y="71" class="small">AWS desplegado · CREATE_COMPLETE · us-east-2 · HTTPS verificado · 14 recursos aprobados</text>
<rect x="35" y="112" width="220" height="105" rx="12" class="box"/><text x="55" y="146" class="label">React /escape</text><text x="55" y="176" class="small">CloudFront HTTPS</text><text x="55" y="199" class="small">S3 privado + OAC</text>
<rect x="35" y="262" width="220" height="95" rx="12" class="box"/><text x="55" y="297" class="label">Flutter</text><text x="55" y="325" class="small">Repositorio HTTP público</text>
<rect x="35" y="407" width="220" height="110" rx="12" class="box"/><text x="55" y="441" class="label">Importador OSM</text><text x="55" y="468" class="small">Maestro / operativo</text><text x="55" y="491" class="small">Datos reales versionados</text>
<rect x="332" y="112" width="245" height="245" rx="12" class="box"/><text x="355" y="149" class="label">EC2 · proxy Caddy</text><text x="355" y="183" class="small">HTTPS 443 / HTTP 80</text><text x="355" y="212" class="small">DNS y certificado reales</text><text x="355" y="241" class="small">API administrativa apagada</text><text x="355" y="270" class="small">8080 solo loopback / Docker</text><text x="355" y="299" class="small">Sin claves en clientes</text><text x="355" y="329" class="small">SSM para operar el host</text>
<rect x="645" y="112" width="530" height="405" rx="12" class="box"/><text x="668" y="148" class="label">Go persistente · un único proceso autoritativo</text><text x="668" y="181" class="small">Docker no-root · rootfs readonly · restart unless-stopped</text>
<rect x="670" y="205" width="215" height="94" rx="9" class="box"/><text x="688" y="237" class="label">Snapshot observable</text><text x="688" y="267" class="small">GET /estado · /grafo</text>
<rect x="926" y="205" width="225" height="94" rx="9" class="box"/><text x="945" y="237" class="label">Motor determinista</text><text x="945" y="267" class="small">POST /paso + x-api-key</text>
<rect x="670" y="345" width="215" height="99" rx="9" class="box"/><text x="688" y="380" class="label">Simulador</text><text x="688" y="409" class="small">Turnos / zombies / refugios</text>
<rect x="926" y="345" width="225" height="99" rx="9" class="box"/><text x="945" y="380" class="label">Grafo offline</text><text x="945" y="409" class="small">Variante y escenarios JSON</text>
<text x="668" y="481" class="small">Sleepers dormidos y PRNG permanecen privados · polling cada turno</text>
<path d="M255 160H332" class="flow"/><path d="M255 306H332" class="flow"/><path d="M577 238H645" class="flow"/><path d="M255 461H610V394H926" class="flow"/>
<path d="M777 345V299" class="flow"/><path d="M885 394H904V252H926" class="flow"/><path d="M926 282H906V325H777V345" class="flow"/>
<text x="900" y="324" class="small">HTTP privado</text>
<rect x="35" y="563" width="540" height="112" rx="12" class="box"/><text x="55" y="599" class="label">CloudWatch</text><text x="55" y="630" class="small">Logs JSON / métricas EC2 / alarmas · retención 7 días</text><text x="55" y="653" class="small">Sin cuerpos HTTP ni credenciales en logs</text>
<rect x="645" y="563" width="530" height="112" rx="12" class="box"/><text x="668" y="599" class="label">AWS Budget existente · verificado</text><text x="668" y="630" class="small">30 USD verificado · avisos 85% / 100% / previsto 100%</text><text x="668" y="653" class="small">Estimación 22,96 USD/mes · gasto informado con retraso</text>
<path d="M920 517V541H305V563" class="flow"/>
<text x="35" y="710" class="small">No se incluyen Redis, RDS, Kubernetes, Lambda ni decisiones externas de IA.</text>
</svg>
