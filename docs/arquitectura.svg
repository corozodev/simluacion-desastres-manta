<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">CoroDev: arquitectura de simulación y publicación</title>
<desc id="desc">React controla sesiones explícitas. Flutter y React móvil observan estados publicados. S3 y CloudFront sirven la web; Caddy dirige HTTP a un monolito Go y al laboratorio hidráulico independiente en EC2 de Ohio. Simulador, rutas, catálogo y snapshots son módulos internos, no microservicios.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17243c;font-size:18px}.heading{font-size:23px;font-weight:700}.small{font-size:15px}.title{font-size:28px;font-weight:700}.edge{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.muted{fill:#475569}.group{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.node{fill:#fff;stroke:#94a3b8;stroke-width:1.6}.public{fill:#e9f4ff;stroke:#3181b6}.private{fill:#e9f8f0;stroke:#33815b}.internal{fill:#fff8e7;stroke:#b68b2f}</style>
